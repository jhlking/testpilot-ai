<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TestPilot Enterprise · 企业级智能测试管理平台</title>
<link rel="stylesheet" href="style.css?v=2.0.2">
</head>
<body>
<div class="app">
  <!-- ============ 侧边栏 ============ -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">TP</div>
      <div class="brand-text">
        <div class="brand-name">TestPilot <span data-i18n="app.suffix">Enterprise</span></div>
        <div class="brand-sub" data-i18n="app.brand.sub">QA Management Platform</div>
      </div>
    </div>

    <div class="project-switch">
      <label data-i18n="common.project">所属项目</label>
      <select id="projectSwitcher" onchange="onProjectChange(this.value)">
        <option value="" data-i18n="common.allProjects">全部项目</option>
      </select>
    </div>

    <nav class="nav">
      <div class="nav-group-label" data-i18n="nav.group.overview">总览</div>
      <button class="nav-item active" data-view="dashboard"><span class="nav-ico">◈</span><span data-i18n="nav.dashboard">质量工作台</span></button>
      <button class="nav-item" data-view="projects"><span class="nav-ico">▣</span><span data-i18n="nav.projects">项目管理</span></button>

      <div class="nav-group-label" data-i18n="nav.group.quality">质量工程</div>
      <button class="nav-item" data-view="requirements"><span class="nav-ico">≡</span><span data-i18n="nav.requirements">需求管理</span></button>
      <button class="nav-item" data-view="cases"><span class="nav-ico">▤</span><span data-i18n="nav.cases">用例库</span></button>
      <button class="nav-item" data-view="plans"><span class="nav-ico">◫</span><span data-i18n="nav.plans">测试计划</span></button>
      <button class="nav-item" data-view="executions"><span class="nav-ico">▷</span><span data-i18n="nav.executions">测试执行</span></button>
      <button class="nav-item" data-view="defects"><span class="nav-ico">⚠</span><span data-i18n="nav.defects">缺陷管理</span></button>

      <div class="nav-group-label" data-i18n="nav.group.ai">智能引擎</div>
      <button class="nav-item" data-view="generate"><span class="nav-ico">✦</span><span data-i18n="nav.generate">RAG 生成台</span></button>
      <button class="nav-item" data-view="knowledge"><span class="nav-ico">◍</span><span data-i18n="nav.knowledge">测试知识库</span></button>

      <div class="nav-group-label" data-i18n="nav.group.system">系统</div>
      <button class="nav-item" data-view="reports"><span class="nav-ico">◉</span><span data-i18n="nav.reports">质量报告</span></button>
      <button class="nav-item" data-view="audit"><span class="nav-ico">⌚</span><span data-i18n="nav.audit">审计日志</span></button>
      <button class="nav-item" data-view="settings"><span class="nav-ico">⚙</span><span data-i18n="nav.settings">系统设置</span></button>
    </nav>

    <div class="sidebar-foot">
      <div class="engine-pill"><span class="dot"></span><span id="engineStatus" data-i18n="top.ready">系统就绪</span></div>
      <div class="sidebar-note" id="modeLabel">SQLite · BM25-RAG v2</div>
    </div>
  </aside>

  <!-- ============ 主内容 ============ -->
  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <div class="crumb"><span data-i18n="app.tagline">企业级智能测试管理平台</span> / <b id="crumbView">质量工作台</b></div>
      </div>
      <div class="topbar-right">
        <div class="global-search">
          <span class="gs-ico">⌕</span>
          <input id="globalSearch" type="text" data-i18n-ph="top.search" placeholder="搜索用例、需求、缺陷…" onkeydown="if(event.key==='Enter')doGlobalSearch()">
        </div>
        <div class="lang-switch" id="langSwitch"></div>
        <span class="status-badge"><span class="dot"></span><span data-i18n="top.ready">系统就绪</span></span>
        <div class="user-chip">
          <div class="avatar">LW</div>
          <div class="user-meta"><b>李伟</b><small data-i18n="top.role">测试经理</small></div>
        </div>
      </div>
    </header>

    <div class="content" id="content">
      <!-- 各视图由 app.js 渲染 -->
    </div>
  </main>
</div>

<!-- ============ 通用抽屉 / 弹窗 ============ -->
<div class="drawer-mask hidden" id="drawerMask" onclick="closeDrawer()"></div>
<aside class="drawer hidden" id="drawer">
  <div class="drawer-head">
    <h3 id="drawerTitle">详情</h3>
    <button class="icon-btn" onclick="closeDrawer()">✕</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<div class="modal-mask hidden" id="modalMask">
  <div class="modal" id="modal">
    <div class="modal-head"><h3 id="modalTitle">新建</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script src="standalone.js?v=2.0.2"></script>
<script src="i18n.js?v=2.0.2"></script>
<script src="app.js?v=2.0.2"></script>
</body>
</html>
